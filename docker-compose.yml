services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: varzea
      POSTGRES_USER: varzea
      POSTGRES_PASSWORD: varzea-dev-only
    ports:
      - "5432:5432"
    volumes:
      - varzea-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varzea -d varzea"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  varzea-postgres-data:
